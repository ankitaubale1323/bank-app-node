version: '3.8'

services:

  backend:
    image: ankitaubale/paisa-bank-backend:latest
    container_name: paisabank-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - paisabank-nw
    depends_on:
      ollama:
        condition: service_started

  frontend:
    image: ankitaubale/paisa-bank-frontend:latest
    container_name: paisabank-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - paisabank-nw
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: paisabank-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - paisabank-nw
    environment:
      - OLLAMA_HOST=0.0.0.0

volumes:
  ollama-models:
    driver: local

networks:
  paisabank-nw:
    driver: bridge
